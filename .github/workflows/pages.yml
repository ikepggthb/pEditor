name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/mobile-dev-editor-vavs4o, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Typecheck and the DOM-free unit tests. A red build should not deploy.
      - run: npm run check

      - run: npm run build

      # A standalone copy, downloadable from /peditor.html, for using the editor
      # without installing it.
      - run: npm run build:single

      # Requires Pages to be switched on once, by hand:
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      # The workflow's own token cannot do it (creating a Pages site needs
      # repository-administration rights, which GITHUB_TOKEN is not granted),
      # so `enablement: true` fails with "Resource not accessible by
      # integration" rather than helping.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
