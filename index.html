<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the layout can reach under the notch and home bar;
         user-scalable=no because pinch-zoom fights the editor's own gestures. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12141a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="A code editor built for writing code on a phone." />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="pEditor" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <title>pEditor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
